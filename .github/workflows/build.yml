name: Build Phone 2 Controller

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -q phone2_real_formy_chrome_ready_to_build.zip -d extracted

      - name: Fix Android theme
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "Theme.AppCompat.Light.NoActionBar": "android:style/Theme.Material.Light.NoActionBar",
              "Theme.AppCompat.NoActionBar": "android:style/Theme.Material.NoActionBar"
          }

          for path in Path("extracted").rglob("*.xml"):
              try:
                  text = path.read_text()
                  original = text

                  for old, new in replacements.items():
                      text = text.replace(old, new)

                  if text != original:
                      path.write_text(text)
                      print("Fixed:", path)

              except Exception as e:
                  print("Skipped:", path, e)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1)")"

          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

          APK="$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not found."
            exit 1
          fi

          echo "APK found: $APK"

          cp "$APK" "$GITHUB_WORKSPACE/phone2-formy.apk"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: phone2-formy-controller
          path: phone2-formy.apk
